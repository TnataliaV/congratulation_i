<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Поздравление!</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <h1 id="greeting"></h1>
    <img src="img/кружок.jpg" alt="Твоё фото" class="photo" id="photo">
    <button id="playMusicBtn">▶️ Включить музыку</button>
    <p class="message" id="message"></p>
    <button class="secret-btn" id="secretBtn">🌸 Нажми! 🌸</button>
  </div>
  <!-- Модальное окно для видео -->
  <div id="videoModal">
    <div class="modal-content">
      <span id="closeVideo">&times;</span>
      <video id="memeVideo" controls>
        <source src="img/видео.mp4" type="video/mp4">
        Ваш браузер не поддерживает видео.
      </video>
    </div>
  </div>

  <audio id="bgMusic" loop>
    <source src="audio/Мари aka Краймбрери - Happy Birthday, Girl (pesni.fm).mp3" type="audio/mpeg">
  </audio>
   <audio id="bgMusic" loop>
    <source src="audio/Мари aka Краймбрери - Happy Birthday, Girl (pesni.fm).mp3" type="audio/mpeg">
  </audio>
   <audio id="bgMusic" loop>
    <source src="audio/Мари aka Краймбрери - Happy Birthday, Girl (pesni.fm).mp3" type="audio/mpeg">
  </audio>



  <script>
    // === Настройки ===
    const name = "Ира"; // ← поменяй на нужное имя
    const messageText = `Дорогая ${name}! 🎉\n\nС Днём Рождения!\n\n`;

    // === Эффект печати текста ===
    function typeWriter(element, text, speed = 50) {
      let i = 0;
      element.textContent = '';
      const lines = text.split('\n');
      let currentLine = 0;

      function typeLine() {
        if (currentLine < lines.length) {
          if (i < lines[currentLine].length) {
            element.textContent += lines[currentLine][i];
            i++;
            setTimeout(typeLine, speed);
          } else {
            element.textContent += '\n';
            i = 0;
            currentLine++;
            setTimeout(typeLine, speed + 100); // пауза между строками
          }
        }
      }
      typeLine();
    }

    // === DOM Загрузка ===
    document.addEventListener('DOMContentLoaded', () => {
      const greeting = document.getElementById('greeting');
      const message = document.getElementById('message');
      const bgMusic = document.getElementById('bgMusic');
      const playMusicBtn = document.getElementById('playMusicBtn');

      const container = document.querySelector('.container');
      const videoModal = document.getElementById('videoModal');
      const memeVideo = document.getElementById('memeVideo');
      const closeVideo = document.getElementById('closeVideo');
      const secretBtn = document.getElementById('secretBtn');

      // Устанавливаем имя
      greeting.textContent = `Привет, ${name}!`;

      // Меняем фото (если есть реальное — подставь ссылку)
      // photo.src = photoUrl;

      // Запускаем эффект печати
      typeWriter(message, messageText);

      // === Музыка: включается только по клику ===
      bgMusic.volume = 0.2; // тихая громкость

      // При клике — включаем музыку
      playMusicBtn.addEventListener('click', () => {
        bgMusic.play()
          .then(() => {
            console.log("Музыка включена!");
            playMusicBtn.style.display = 'none'; // прячем кнопку
          })
          .catch(e => {
            alert("Не удалось включить музыку. Нажми ещё раз.");
            console.error("Ошибка:", e);
          });
      });

      // === Секретная кнопка: открывает видео ===
      secretBtn.addEventListener('click', () => {
        // Останавливаем фоновую музыку
        bgMusic.pause();
        videoModal.style.display = 'flex'; // показываем модальное окно
        memeVideo.play();
        container.style.display = 'none'; // скрываем контент
        secretBtn.textContent = "Спрячь видео! 💞";
      });

      // === Крестик: закрывает видео ===
      closeVideo.addEventListener('click', () => {
        videoModal.style.display = 'none'; // скрываем модальное окно
        memeVideo.pause();
        memeVideo.currentTime = 0; // сбрасываем видео
        container.style.display = 'block'; // возвращаем контент
        secretBtn.textContent = "🌸 Нажми! 🌸";
        // Показываем кнопку "Включить музыку" снова
        playMusicBtn.style.display = 'block';
      });

      // === Закрытие по клику на фон (опционально) ===
      // videoModal.addEventListener('click', (e) => {
      //   if (e.target === videoModal) {
      //     closeVideo.click(); // как будто нажали на крестик
      //   }
      // });
    });
  </script>

</body>

</html>
